<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16171a">
  <meta name="application-name" content="Mibro">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/central-favicon.svg">
  <link rel="apple-touch-icon" href="/assets/app-icon-192.png">
  <title>Entrar</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="auth-shell">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <section class="glass-card">
      <img class="login-logo" src="/assets/central-mark.svg" alt="Central de Atendimento">
      <span class="eyebrow" id="eyebrow">ACESSO SEGURO</span>
      <h1 id="title">Entrar na central</h1>
      <p id="description">Atendimento, clientes e conversas em um só lugar.</p>
      <form id="auth-form">
        <label id="name-field" hidden><span>Nome</span><input id="name" autocomplete="name" placeholder="Seu nome"></label>
        <label><span>E-mail</span><input id="email" type="email" autocomplete="username" placeholder="voce@empresa.com" required></label>
        <label><span>Senha</span><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Sua senha" required></label>
        <div id="error" class="error" role="alert"></div>
        <button id="submit" type="submit">Entrar</button>
      </form>
      <footer><i></i> WhatsApp Cloud API conectado</footer>
    </section>
    <p class="page-footer">Mibro Brasil • Central de Atendimento</p>
  </main>
  <script src="/js/login.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
